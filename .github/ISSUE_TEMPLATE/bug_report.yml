name: "Bug Report"
description: "Report a bug to help us improve the project."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: system_version
    attributes:
      label: System Version
      description: What version of Docker/OS are you using?
      placeholder: e.g. Docker 20.10.x, Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: environment_version
    attributes:
      label: Environment Version
      description: What version of this Docker image are you using?
      placeholder: e.g. 3.0.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where is the bug occurring?
      options:
        - Local
        - Development
        - Staging
        - Production
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Error Output
      description: Please paste any relevant logs or error output here.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
