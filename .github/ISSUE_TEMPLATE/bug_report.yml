name: "Bug Report"
description: "Report a bug to help us improve the project."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: input
    id: version
    attributes:
      label: "Image Version"
      description: "Which version of the Docker image are you using?"
      placeholder: "e.g., 3.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "Where are you running this?"
      options:
        - Local
        - Development
        - Staging
        - Production
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "OS"
      description: "What operating system are you using?"
      options:
        - Linux
        - macOS
        - Windows (WSL2)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Run '...'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs/Error Output"
      description: "Please copy and paste any relevant log output."
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: "If applicable, add screenshots to help explain your problem."
